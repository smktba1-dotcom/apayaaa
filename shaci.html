
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dedek Sachi 💗</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffe4e1);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    width: 280px;
    box-shadow: 0 8px 30px #e8799c66;
    z-index: 2;
}

h1 { color: #ff4f91; }

p { color: #9b5270; }

.heart {
    font-size: 60px;
    animation: beat 0.8s infinite;
}

@keyframes beat {
    50% { transform: scale(1.3); }
}

button {
    background: #ff69a4;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 20px;
    cursor: pointer;
}

.love {
    position: absolute;
    bottom: -30px;
    animation: terbang 5s linear forwards;
}

@keyframes terbang {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">💗</div>
    <h1>Dedek Sachi! 🥺</h1>

    <p>
        Dedek Sachi itu imut banget,
        tapi ada satu kekurangannya...
    </p>

    <button onclick="showLove()">Apa tuh? 🤨</button>

    <h3 id="pesan"></h3>
</div>

<script>
function showLove() {
    document.getElementById("pesan").innerHTML =
    "SUKA BIKIN ORANG SENYUM SENDIRI WKWKWK! 😂💕";

    for(let i = 0; i < 30; i++) {
        let love = document.createElement("div");
        love.className = "love";
        love.innerHTML = "💗";
        love.style.left = Math.random() * 100 + "vw";
        love.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.body.appendChild(love);

        setTimeout(() => love.remove(), 5000);
    }
}
</script>

</body>
</html>
